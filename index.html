<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>整理されたデスクトップ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(170deg, #87CEEB 0%, #5BA3D9 25%, #3A7CA5 45%, #2E6B3F 50%, #4A8C5C 55%, #6B8E5A 65%, #8FAE7B 75%, #C2D6A4 100%);
      font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo', sans-serif;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 55%, rgba(60,100,50,0.15) 0%, transparent 60%),
        radial-gradient(circle at 50% 35%, rgba(200,220,255,0.08) 0%, transparent 40%);
      pointer-events: none;
    }

    /* === タスクバー（Windows 11 風） === */
    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: rgba(32, 32, 32, 0.88);
      backdrop-filter: blur(20px) saturate(1.5);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      z-index: 1000;
    }

    .taskbar-center {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .tb-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
      font-size: 20px;
    }

    .tb-icon:hover { background: rgba(255,255,255,0.1); }

    .tb-icon.active::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 3px;
      border-radius: 2px;
      background: #76b9ed;
    }

    .tb-icon svg { width: 22px; height: 22px; }

    .taskbar-right {
      position: absolute;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tb-tray { display: flex; align-items: center; gap: 4px; font-size: 14px; color: rgba(255,255,255,0.7); }

    .taskbar-clock {
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      text-align: right;
      line-height: 1.35;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .taskbar-clock:hover { background: rgba(255,255,255,0.08); }

    .taskbar-search {
      position: absolute;
      left: 12px;
      display: flex;
      align-items: center;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 5px 14px;
      gap: 8px;
      cursor: text;
      width: 200px;
    }

    .search-box span { color: rgba(255,255,255,0.5); font-size: 13px; }
    .search-box svg { width: 16px; height: 16px; fill: rgba(255,255,255,0.5); }

    /* === デスクトップ === */
    .desktop {
      width: 100%;
      height: calc(100vh - 48px);
      position: relative;
    }

    /* === メインアプリ3つ（中央目立つ位置） === */
    .main-apps {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 60px;
      z-index: 10;
    }

    .app-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 16px 20px;
      border-radius: 20px;
      transition: all 0.2s ease;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .app-card:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .app-card:active { transform: translateY(0) scale(0.97); }

    .app-icon-lg {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }

    .app-icon-lg svg { width: 40px; height: 40px; }

    .app-claude .app-icon-lg { background: linear-gradient(135deg, #da7756, #c45a3a); }
    .app-line .app-icon-lg { background: linear-gradient(135deg, #06c755, #04a544); }
    .app-notion .app-icon-lg { background: linear-gradient(135deg, #fff, #e8e8e8); }

    .app-card .app-name {
      margin-top: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }

    /* === 左列：フォルダ === */
    .side-grid {
      position: absolute;
      top: 14px;
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .icon-item {
      width: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 6px 4px;
      border-radius: 6px;
      transition: background 0.12s;
    }

    .icon-item:hover { background: rgba(255,255,255,0.14); }
    .icon-item:active { background: rgba(100,170,255,0.3); }

    .icon-item .ico { font-size: 38px; line-height: 1; filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.4)); }

    .icon-item .lbl {
      margin-top: 3px;
      color: white;
      font-size: 11px;
      text-align: center;
      line-height: 1.25;
      max-width: 76px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 8px rgba(0,0,0,0.5);
      word-break: break-all;
    }

    /* === 右列：アプリショートカット === */
    .apps-grid {
      position: absolute;
      top: 14px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* === 右下ゴミ箱 === */
    .trash {
      position: absolute;
      bottom: 12px;
      left: 12px;
    }

    /* セクション見出し */
    .section-label {
      color: rgba(255,255,255,0.5);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 8px 2px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
  </style>
</head>

<!-- ====== タスクバー ====== -->

<script>
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const y = now.getFullYear();
    const mo = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    document.getElementById('clock').innerHTML = h + ':' + m + '<br>' + y + '/' + mo + '/' + d;
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
